name: Build Gajkesari Tally Connector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/tally-bridge/**"
      - "installer/tally-bridge/**"
      - "scripts/build-tally-connector-installer.mjs"
      - "scripts/prepare-connector-release.mjs"
      - ".github/workflows/build-tally-connector-installer.yml"

permissions:
  contents: write

concurrency:
  group: connector-release
  cancel-in-progress: false

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm ci

      - name: Install Windows Electron runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gajkesari-electron-runtime"
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Push-Location $runtimeRoot
          npm init --yes
          npm install --save-exact electron@43.2.0
          npx install-electron
          Pop-Location
          $electronDist = Join-Path $runtimeRoot "node_modules\electron\dist"
          if (-not (Test-Path (Join-Path $electronDist "electron.exe"))) {
            throw "Electron runtime was not downloaded to $electronDist"
          }
          "GAJKESARI_CONNECTOR_RUNTIME=$electronDist" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate installer identity
        run: npm run installer:tally-bridge:validate

      - name: Test updater and duplicate protections
        run: node --test installer/tally-bridge/electron-app/updates.test.mjs installer/tally-bridge/electron-app/update-helper.test.mjs apps/tally-bridge/src/bridge.test.mjs

      - name: Build Gajkesari installer
        run: npm run installer:tally-bridge

      - name: Prepare versioned installer and update manifest
        run: node scripts/prepare-connector-release.mjs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: GajkesariTallyConnectorSetup
          path: installer/tally-bridge/release/*
          if-no-files-found: error

      - name: Publish permanent GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content installer/tally-bridge/release/connector-update.json -Raw | ConvertFrom-Json
          $tag = "gajkesari-tally-connector-v$($manifest.version)"
          $installer = "installer/tally-bridge/release/GajkesariTallyConnectorSetup-$($manifest.version).exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Published updates are immutable; increment the connector version."
          }
          gh release create $tag $installer installer/tally-bridge/release/connector-update.json --draft --target $env:GITHUB_SHA --title "Gajkesari Tally Connector $($manifest.version)" --notes "Windows connector with in-app updates. Download the installer for first-time setup; subsequent releases can be installed from Connector updates."
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed. The update has not been published." }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the completed update release." }
