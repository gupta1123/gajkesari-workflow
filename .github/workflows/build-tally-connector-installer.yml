name: Build Gajkesari Tally Connector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install Windows Electron runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gajkesari-electron-runtime"
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Push-Location $runtimeRoot
          npm init --yes
          npm install --save-exact electron@43.2.0
          Pop-Location
          $electronDist = Join-Path $runtimeRoot "node_modules\electron\dist"
          if (-not (Test-Path (Join-Path $electronDist "electron.exe"))) {
            throw "Electron runtime was not downloaded to $electronDist"
          }
          "GAJKESARI_CONNECTOR_RUNTIME=$electronDist" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate installer identity
        run: npm run installer:tally-bridge:validate

      - name: Build Gajkesari installer
        run: npm run installer:tally-bridge

      - name: Record installer checksum
        shell: pwsh
        run: Get-FileHash installer\tally-bridge\output\GajkesariTallyConnectorSetup.exe -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: GajkesariTallyConnectorSetup
          path: installer/tally-bridge/output/GajkesariTallyConnectorSetup.exe
          if-no-files-found: error

      - name: Publish permanent GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "gajkesari-tally-connector-v0.1.0"
          $installer = "installer\tally-bridge\output\GajkesariTallyConnectorSetup.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Gajkesari Tally Connector v0.1.0" --notes "Windows installer for the Gajkesari Tally Connector. Registers the gajkesari-tally protocol and installs separately under C:\Gajkesari\tally-bridge."
          }
          gh release upload $tag $installer --clobber
